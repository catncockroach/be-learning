services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-demo
    restart: unless-stopped
    environment:
      POSTGRES_USER: hai
      POSTGRES_PASSWORD: hai
      POSTGRES_DB: hai
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hai -d hai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
